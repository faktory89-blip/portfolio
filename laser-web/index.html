<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laser Web Workspace</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #111827;
      border-bottom: 1px solid #1f293d;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 1.1rem; color: #38bdf8; font-weight: 600; }
    .toolbar {
      background: #0d1322;
      border-bottom: 1px solid #1f293d;
      padding: 10px 24px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    button {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { background: #38bdf8; color: #041017; font-weight: 600; }
    .workspace {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #060911;
      padding: 20px;
      position: relative;
    }
    canvas {
      background: #0b1120;
      border: 1px solid #1e293b;
      box-shadow: 0 0 24px rgba(0,0,0,0.6);
      border-radius: 4px;
    }
    .status-bar {
      background: #111827;
      border-top: 1px solid #1f293d;
      padding: 8px 24px;
      font-size: 0.75rem;
      font-family: monospace;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <header>
    <h1>Laser Web: Fabrication Toolpath & Layout Staging</h1>
    <span style="font-size: 0.8rem; color: #94a3b8;">Bed Size: 400mm x 400mm</span>
  </header>

  <div class="toolbar">
    <button onclick="addRect()">+ Add Rectangle</button>
    <button onclick="addCircle()">+ Add Circle</button>
    <button onclick="clearCanvas()">Clear Bed</button>
    <span style="color: #64748b; font-size: 0.8rem; margin-left: auto;">Interactive HTML5 Canvas Workspace</span>
  </div>

  <div class="workspace">
    <canvas id="laserBed" width="600" height="600"></canvas>
  </div>

  <div class="status-bar">
    <span id="coordDisplay">X: 0.00mm | Y: 0.00mm</span>
    <span>Grid: 10mm Snap • Status: Active</span>
  </div>

  <script>
    const canvas = document.getElementById('laserBed');
    const ctx = canvas.getContext('2d');
    const coordDisplay = document.getElementById('coordDisplay');

    let shapes = [
      { type: 'rect', x: 100, y: 100, w: 120, h: 80, stroke: '#38bdf8' },
      { type: 'circle', x: 350, y: 300, r: 50, stroke: '#fbbf24' }
    ];

    function drawGrid() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#162032';
      ctx.lineWidth = 1;

      for (let x = 0; x <= canvas.width; x += 30) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y <= canvas.height; y += 30) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }
    }

    function drawShapes() {
      drawGrid();
      shapes.forEach(shape => {
        ctx.strokeStyle = shape.stroke;
        ctx.lineWidth = 2;
        ctx.beginPath();
        if (shape.type === 'rect') {
          ctx.strokeRect(shape.x, shape.y, shape.w, shape.h);
        } else if (shape.type === 'circle') {
          ctx.arc(shape.x, shape.y, shape.r, 0, Math.PI * 2);
          ctx.stroke();
        }
      });
    }

    function addRect() {
      shapes.push({
        type: 'rect',
        x: Math.random() * (canvas.width - 150),
        y: Math.random() * (canvas.height - 150),
        w: 100,
        h: 70,
        stroke: '#38bdf8'
      });
      drawShapes();
    }

    function addCircle() {
      shapes.push({
        type: 'circle',
        x: Math.random() * (canvas.width - 120) + 60,
        y: Math.random() * (canvas.height - 120) + 60,
        r: 40,
        stroke: '#34d399'
      });
      drawShapes();
    }

    function clearCanvas() {
      shapes = [];
      drawShapes();
    }

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / 1.5).toFixed(2);
      const y = ((e.clientY - rect.top) / 1.5).toFixed(2);
      coordDisplay.textContent = `X: ${x}mm | Y: ${y}mm`;
    });

    drawShapes();
  </script>
</body>
</html>
