<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Developer Portfolio</title>
  <style>
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 60px 20px;
      display: flex;
      justify-content: center;
    }
    .wrapper {
      max-width: 700px;
      width: 100%;
    }
    .badge {
      background: #0284c7;
      color: #ffffff;
      font-size: 13px;
      padding: 4px 12px;
      border-radius: 99px;
      font-weight: 600;
      letter-spacing: 0.5px;
      display: inline-block;
    }
    h1 {
      font-size: 2.5rem;
      margin: 20px 0 12px;
      color: #ffffff;
    }
    p.subtitle {
      font-size: 1.15rem;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .card {
      background: #131b2e;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 20px;
    }
    .card h2 {
      margin-top: 0;
      font-size: 1.3rem;
      color: #38bdf8;
    }
    .card p {
      color: #cbd5e1;
      line-height: 1.5;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <span class="badge">Live Site</span>
    <h1>Windows & Mobile App Developer</h1>
    <p class="subtitle">Building responsive, high-performance desktop and mobile applications.</p>
    
    <div class="card">
      <h2>Featured Applications</h2>
      <p>Currently wrapping up testing on two cross-platform builds. Project demos and store links will appear here shortly.</p>
    </div>
  </div>
</body>
</html>
